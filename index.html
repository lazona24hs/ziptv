<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Panel - ZIPTV</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1e1e2f, #2a2a40);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      background: #252538;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 400px;
      color: #ffffff;
    }

    .login-card h2 {
      margin-bottom: 1.5rem;
      text-align: center;
      font-size: 1.8rem;
      color: #00d2ff;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: #b3b3b3;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #3d3d5c;
      border-radius: 6px;
      background: #1a1a2e;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s;
    }

    .form-group input:focus {
      border-color: #00d2ff;
    }

    .btn-submit {
      width: 100%;
      padding: 0.8rem;
      border: none;
      border-radius: 6px;
      background: linear-gradient(90deg, #00c6ff, #0072ff);
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.3s;
      margin-top: 1rem;
    }

    .btn-submit:hover {
      opacity: 0.9;
    }

    .error-msg {
      color: #ff4d4d;
      font-size: 0.85rem;
      margin-top: 1rem;
      text-align: center;
      display: none;
    }
  </style>
</head>

    <h2>Bienvenido</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" required placeholder="Tu usuario">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn-submit">Ingresar</button>
      <p id="errorMsg" class="error-msg">Usuario o contraseña incorrectos</p>
    </form>
  </div>
